name: Website verification gates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-verification-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PRODUCT_APP_UPSTREAM_URL: http://127.0.0.1:4311
  SOURCE_STATUS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node matching production major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Existing tests and smoke harness self-tests
        run: node --test tests/*.test.mjs scripts/source-status.test.mjs scripts/ci/*.test.mjs
      - name: Lint
        run: npm run lint
      - name: Production build and TypeScript
        run: npm run build
      - name: Check existing calculation scripts
        run: |
          node scripts/verify-blog-money-math.mts
          node scripts/verify-shift-routine.mts
      - name: Read-only local pages, SEO, assets, redirects and app proxy
        run: node scripts/ci/website-smoke.mjs
      - name: Report outcome without deploying
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '### Iron Compass website verification\nCommit: %s\nResult: %s\nNo production deployment or live-account tests performed.\n' "$SOURCE_STATUS_COMMIT" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
