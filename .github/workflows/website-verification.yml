name: Website verification gates
on:
  push:
    branches:
      - audit/automated-website-gates-20261109
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Existing source continuity tests
        run: node --test scripts/source-status.test.mjs
      - name: Lint
        run: npm run lint
      - name: Production build and TypeScript verification
        run: npm run build
      - name: Report outcome
        if: always()
        run: |
          echo "### Iron Compass website verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: \`$JOB_STATUS\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
